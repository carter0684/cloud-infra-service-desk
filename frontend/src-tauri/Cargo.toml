[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
# Lets target="_blank" links (Engineer Notes attachments,
# AWS Support/Freshservice/AMS console links, "Open in AWS Console"
# etc.) actually open in the user's default OS browser from inside the
# desktop app's webview. Without this plugin + the shell:allow-open
# permission (see capabilities/desktop.json), Tauri's webview silently
# swallows any attempt to open a new window/tab — no error, no popup,
# just nothing happening, which is exactly the desktop-app symptom
# reported for note attachments (and would affect every other
# target="_blank" link in the app the same way).
tauri-plugin-shell = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
